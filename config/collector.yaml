# Handheld LUMI collector. Paths are on the Pi SD card.
data_dir: /home/pi/lumi
camera_serial: ""          # empty = derive from /proc/cpuinfo
primarykey_url: https://app.primarykey.ai
setup_port: 8080

video:
  # Full 2028x1520 readout, scaled to 4:3. The H.264 block cannot encode 2028x1520.
  width: 1440
  height: 1080
  fps: 30
  bitrate: 15000000          # fast passes lose about 1 dB; the encoder tops out at 25 Mbit/s
  lores_size: [320, 240]
  sensor_width: 2028
  sensor_height: 1520
  sensor_bit_depth: 12
  tuning_file: /home/pi/imx477_fisheye.json
  # Shutter ceiling in µs; longer exposures blur features SLAM tracks. 0 = tuning file's own.
  max_exposure_us: 8000
  max_gain: 16               # analogue only; the IMX477 goes digital above about 22x
  sharpness: 3.0             # tuning default 1; above about 4, halos make false corners
  denoise: "off"             # off | fast; fast smooths low-contrast texture away
  stream_port: 8888          # rpicam-vid --listen, played by `solarian lumi --stream`

imu:
  driver: mpu6050          # mpu6050 | mock
  address: 104             # 0x68
  rate_hz: 200
  # Sensor XYZ -> GoPro ZXY storage order. Identity means the breakout
  # is mounted with +X right, +Y down the lens, +Z toward the scene.
  acc_map: [2, 0, 1]       # out Z,X,Y from sensor XYZ
  gyr_map: [2, 0, 1]
  acc_sign: [1, 1, 1]
  gyr_sign: [1, 1, 1]

buttons:
  key1: 21                 # select dataset / record start/stop
  key2: 20                 # delete dataset / delete last / delete selected
  key3: 16                 # settings (short) / shutdown (2s)
  joy_up: 6
  joy_down: 19
  joy_left: 5
  joy_right: 26
  joy_press: 13
  long_press_s: 2.0

display:                   # Waveshare 1.44" LCD HAT, ST7735S
  width: 128
  height: 128
  spi_port: 0
  spi_device: 0
  gpio_dc: 25
  gpio_rst: 27
  gpio_bl: 24
  rotate: 0

power:
  fuel_gauge_address: 67   # 0x43 INA219; percent from cell voltage 3.0–4.2 V
  charger_gpio: 4
  shutdown_cmd: ["sudo", "shutdown", "-h", "now"]
